  <line x1="0" y1="100" x2="1024" y2="100" stroke="#1E293B" stroke-width="2"/>
  <line x1="0" y1="400" x2="1024" y2="400" stroke="#1E293B" stroke-width="2"/>
  <!-- Title & Tagline -->
  <text x="72" y="160" font-family="sans-serif" font-size="64" font-weight="bold" fill="#F8FAFC">PrismCalc</text>
  <text x="72" y="220" font-family="monospace" font-size="28" font-weight="bold" fill="#00F5D4">NORMAL • SCIENTIFIC • PROGRAMMER</text>
  <text x="72" y="285" font-family="sans-serif" font-size="24" fill="#94A3B8">• Retro Pixel B/W, Modern &amp; Futuristic Skins</text>
  <text x="72" y="325" font-family="sans-serif" font-size="24" fill="#94A3B8">• 128-Bit Exact Decimal &amp; 64-Bit Bitwise Engine</text>
  <text x="72" y="365" font-family="sans-serif" font-size="24" fill="#38BDF8">• 100% Offline • Zero Permissions • Zero Telemetry</text>
  <!-- Visual Calculator Card Preview on Right -->
  <rect x="680" y="60" width="272" height="380" rx="28" fill="#0A1022" stroke="#00F5D4" stroke-width="4"/>
  <rect x="704" y="88" width="224" height="84" rx="14" fill="#070D1C" stroke="#38BDF8" stroke-width="2"/>
  <text x="912" y="122" font-family="monospace" font-size="18" fill="#5CE1E6" text-anchor="end">sin(30) + 0.2</text>
  <text x="912" y="158" font-family="monospace" font-size="34" font-weight="bold" fill="#00F5D4" text-anchor="end">0.7</text>
